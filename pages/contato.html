<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endereço para o pedido</title>

    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/contato.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="div-logo">
            <img class="logotipo" src="../img/logo.png" alt="Logotipo da Confeitaria">
        </div>

        <div class="div-menu">
            <h1>Confeitaria Sempre Doce</h1>

            <nav aria-label="Navegação principal">
                <ul>
                    <li><a href="../index.html">Início</a></li>
                    <li><a href="sobre.html">Sobre</a></li>
                    <li><a href="cardapio.html">Cardápio</a></li>
                    <li><a href="contato.html" aria-current="page">Contato</a></li>
                </ul>
            </nav>
        </div>
        <div class="div-logo"></div>
    </header>

    <main class="contato">
        <section class="endereco-section" aria-labelledby="titulo-endereco">
            <h2 id="titulo-endereco">Endereço para o pedido</h2>
            <p>Informe seu CEP para preencher o endereço automaticamente.</p>

            <form id="form-endereco">
                <div class="campo campo-cep">
                    <label for="cep">CEP</label>
                    <input id="cep" name="cep" type="text" inputmode="numeric" autocomplete="postal-code"
                        placeholder="00000-000" maxlength="9" pattern="[0-9]{5}-?[0-9]{3}" required>
                </div>

                <div class="campos-endereco">
                    <div class="campo campo-logradouro">
                        <label for="logradouro">Logradouro</label>
                        <input id="logradouro" name="logradouro" type="text" autocomplete="address-line1" required>
                    </div>

                    <div class="campo campo-numero">
                        <label for="numero">Número</label>
                        <input id="numero" name="numero" type="text" inputmode="numeric"
                            autocomplete="address-line2" required>
                    </div>

                    <div class="campo">
                        <label for="bairro">Bairro</label>
                        <input id="bairro" name="bairro" type="text" autocomplete="address-level3" required>
                    </div>

                    <div class="campo">
                        <label for="cidade">Cidade</label>
                        <input id="cidade" name="cidade" type="text" autocomplete="address-level2" required>
                    </div>

                    <div class="campo campo-uf">
                        <label for="uf">UF</label>
                        <input id="uf" name="uf" type="text" autocomplete="address-level1" maxlength="2" required>
                    </div>

                    <div class="campo">
                        <label for="estado">Estado</label>
                        <input id="estado" name="estado" type="text" required>
                    </div>
                </div>

                <p id="mensagem-cep" class="mensagem-cep" aria-live="polite"></p>
                <button type="submit">Confirmar endereço</button>
                <p id="mensagem-formulario" class="mensagem-formulario" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script src="../js/contato.js"></script>
</body>

</html>
